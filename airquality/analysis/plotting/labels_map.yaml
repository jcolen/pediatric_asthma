# For plotting purposes, this file containts human-readable
# labels for each exposure variable present in the dataset. 

# Air Quality
NO2: NO$_2$ (ppb)
SO2: SO$_2$ (ppb)
CO: CO (ppm)
O3: O$_3$ (ppm)
PM25: PM$_{2.5}$ ($\mu$g/m$^3$)
PM10: PM$_{10}$ ($\mu$g/m$^3$)
Smoke: Smoke
AQI: AQI

# Weather
HeatIndex: Heat Index ($^{\circ}$C)
TotalPrecipitation: Precipitation (mm)
AverageDryBulbTemperature: Temperature ($^{\circ}$C)
AverageRelativeHumidity: Relative Humidity (%)

# COI components
COI_overall_perc: COI (%)
COI_education_perc: COI Education (%)
COI_health_env_perc: COI Health/Environment (%)
COI_socioeco_perc: COI Socioeconomic (%)

# SVI components
SVI_overall_perc: SVI (%)
SVI_socioeco_perc: SVI Socioeconomic (%)
EP_POV150: Poverty (%)
EP_UNEMP: Unemployed (%)
EP_HBURD: Housing Burden (%)
EP_NOHSDP: No HS Diploma (%)
EP_UNINSUR: Uninsured (%)
EPL_POV150: Poverty (%)
EPL_UNEMP: Unemployed (%)
EPL_HBURD: Housing Burden (%)
EPL_NOHSDP: No HS Diploma (%)
EPL_UNINSUR: Uninsured (%)

SVI_household_perc: SVI Household (%)
EP_AGE65: Age $\geq$ 65 (%)
EP_AGE17: Age $\leq$ 17 (%)
EP_DISABL: Disability (%)
EP_SNGPNT: Single-parent (%)
EP_LIMENG: Limited English (%)
EPL_AGE65: Age $\geq$ 65 (%)
